<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}المسبحة الإلكترونية{% endblock %}</title>
{% block meta %}{% endblock %}
<style>
:root{--bg:#eef7f0;--card:#fff;--ink:#17301f;--mute:#4f6b59;--g1:#1b7a3d;--g2:#2e9e57;--g3:#d9efe0;--line:#c5e2cf}
@media (prefers-color-scheme:dark){:root{--bg:#0d1a12;--card:#14261b;--ink:#e6f4ea;--mute:#9bb9a5;--g1:#3fbf6c;--g2:#2e9e57;--g3:#1c3526;--line:#26402f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Amiri","Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;line-height:1.9}
.wrap{max-width:640px;margin:0 auto;padding:16px}
header{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:20px;padding:24px 18px;text-align:center}
header h1{margin:6px 0;font-size:26px;line-height:1.6}header p{margin:4px 0 0;font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
h2{margin:0 0 8px;color:var(--g1);font-size:21px}
.btn{display:inline-block;padding:11px 18px;border-radius:12px;background:var(--g1);color:#fff;text-decoration:none;border:0;font:inherit;font-size:17px;cursor:pointer}
.btn.alt{background:var(--g3);color:var(--ink);border:1px solid var(--line)}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:17px;margin:4px 0 12px}
label{font-size:16px;color:var(--mute)}
.err{color:#c0392b}
a{color:var(--g1)}
footer{text-align:center;color:var(--mute);font-size:14px;margin:18px 0}
</style>
</head>
<body><div class="wrap">{% block body %}{% endblock %}
<footer>انشرها ولك الأجر — «الدال على الخير كفاعله»</footer></div></body></html>
